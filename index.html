<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift Report Electrical P14</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700" rel="stylesheet">
<style>
:root{--bg:#f1f4f8;--card:#fff;--ink:#17212b;--mut:#66727f;--line:#dbe2ea;--acc:#1d5fa8;--accink:#fff;--field:#f6f8fb;--bar:#12304f;--y:#ffd500;--soft:#e7f0fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151a;--card:#1a2128;--ink:#e8edf2;--mut:#9aa7b3;--line:#2f3943;--acc:#6aa7e6;--accink:#0d1d2c;--field:#141a20;--bar:#0b1b2b;--soft:#203244}}
:root[data-theme="dark"]{--bg:#10151a;--card:#1a2128;--ink:#e8edf2;--mut:#9aa7b3;--line:#2f3943;--acc:#6aa7e6;--accink:#0d1d2c;--field:#141a20;--bar:#0b1b2b;--soft:#203244}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:40}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--y);color:#222;display:grid;place-items:center;font-size:20px;flex:none}
.appbar h1{margin:0;font-size:16px;font-weight:600;line-height:1.2}
.appbar p{margin:0;font-size:12px;opacity:.75}
.appbar .sp{flex:1}
.ib{width:44px;height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;line-height:1}
.menu{position:absolute;right:12px;top:100%;margin-top:4px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;min-width:210px;display:none}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:8px;font-size:15px}
.menu button:hover{background:var(--soft)}
/* Layout */
main{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:18px;padding:16px;max-width:1500px;margin:0 auto;align-items:start}
#panePrev{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.card h2{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-bottom:5px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
textarea{resize:none;line-height:1.45;overflow:hidden;display:block}
.f{margin-bottom:12px}.f:last-child{margin-bottom:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:46px;border:1px solid var(--line);background:var(--field);border-radius:10px;font-weight:600;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.chip{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--acc);font-size:13px;font-weight:500}
.note{font-size:12.5px;color:var(--mut);margin:6px 0 0}
/* Kartu kegiatan */
.entry{padding:0;overflow:hidden}
.eh{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;min-height:64px}
.no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--y);color:#222;font-weight:700;display:grid;place-items:center}
.sm{flex:1;min-width:0;display:flex;flex-direction:column}
.sm b{font-size:15px;font-weight:600}
.sm small{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mut);transition:transform .2s;font-size:18px}
.open .chev{transform:rotate(180deg)}
.eb{display:none;padding:2px 14px 14px;border-top:1px solid var(--line);padding-top:14px}
.open .eb{display:block}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--field);border-radius:10px;font-size:14px}
.acts .del{color:#c0392b}
.addbtn{width:100%;min-height:54px;border:2px dashed var(--acc);background:var(--soft);color:var(--acc);border-radius:14px;font-weight:600;font-size:16px;margin-bottom:12px}
select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 10px;min-height:46px}
.sub{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.sub .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;min-height:38px;font-size:14px}
.mini.del{color:#c0392b}
.row3 label{line-height:1.25}
.row3 select{padding:11px 2px;font-size:15px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.sh{margin:2px 0 8px;font-weight:600;font-size:13px;color:var(--acc)}
.rowd{display:flex;gap:8px;margin-bottom:8px}.rowd>div{flex:1}
.mrow{padding:10px 0;border-top:1px solid var(--line)}
/* Pratinjau */
.exports{display:flex;gap:8px;margin-bottom:12px}
.ex{position:relative;flex:1;min-width:0}
.ex>button{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;padding:8px 6px;font-size:14px}
.ex>button.sec{border:2px solid var(--acc);color:var(--acc)}
.dlmenu{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;display:none}
.dlmenu.show{display:block}
.dlmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 12px;border-radius:8px;font-size:15px;min-height:46px}
.dlmenu button:hover{background:var(--soft)}
.exports .p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.exports button:disabled{opacity:.6}
.zoomrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--mut)}
.zoomrow button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;min-height:36px}
#fit{width:100%;overflow:hidden;border-radius:6px}
#scaler{width:1120px;transform-origin:0 0}
/* Tab bawah (smartphone) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
.tabbar button{flex:1;min-height:52px;border:0;background:none;border-radius:12px;font-weight:600;font-size:14px;color:var(--mut)}
.tabbar button[aria-selected="true"]{background:var(--soft);color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;background:#1f2933;color:#fff;border-radius:12px;padding:12px 16px;display:none;gap:14px;align-items:center;max-width:92vw;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast.show{display:flex}.toast button{border:0;background:none;color:var(--y);font-weight:600;padding:4px}
@media(max-width:900px){
 main{display:block;padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px))}
 .pane{display:none}
 body[data-tab="form"] #paneForm,body[data-tab="prev"] #panePrev{display:block}
 #panePrev{position:static}
 .tabbar{display:flex}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media(min-width:901px){.toast{bottom:24px}}
/* ===== Kertas laporan (selalu terang) ===== */
#paper2{margin-top:24px}
#scaler.merged{background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.25)}
#scaler.merged .paper{box-shadow:none}
#scaler.merged #paper2{margin-top:0;padding-top:8px}
table.rt+table.rt{margin-top:22px}
.ah{margin:16px 0 10px;font-size:15px;font-weight:600}
.rt.grid td{border:1px solid #222;text-align:center;padding:8px 6px;vertical-align:middle}
.rt.grid td.b{font-weight:600;background:#f3f7fb}
.paper{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#000;width:1120px;min-width:1120px;padding:26px 30px 22px;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif;box-shadow:0 1px 8px rgba(0,0,0,.25)}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.rtitle{margin:0 auto;padding:10px 38px;text-align:center;font-weight:700;font-size:16px;line-height:1.35;background:#ffd500;border:2px solid #222;border-radius:12px;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.rdate{border:2px solid #222;padding:12px 16px;font-size:13px;font-weight:700;white-space:nowrap}
.rdate span{font-weight:500;font-size:14px;margin-left:6px}
table.rt{width:100%;border-collapse:collapse;border:2px solid #222;table-layout:fixed;font-size:13px}
.rt th{border:2px solid #222;padding:8px 4px;font-weight:700;text-align:center;background:#bfe3f7;color:#000}
.rt td{border-left:2px solid #222;border-right:2px solid #222;padding:5px 7px;vertical-align:top;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.rt td.c{text-align:center}
.rt tr.last td{height:100%}
.rt tfoot td{border:0}
.rt td.sp{border-top:0}
.rt tbody{border-top:2px solid #222}
.rt .big{font-size:20px;font-weight:600;text-align:center}
.legend{margin-top:12px;font-size:13px;display:grid;grid-template-columns:70px 28px auto;row-gap:1px;width:260px;line-height:1.3}
.sign{display:flex;justify-content:flex-end;gap:60px;margin-top:6px;font-size:12px}
@media print{
@page{size:A4 landscape;margin:8mm}
body{background:#fff}
body::before,.appbar,.tabbar,.toast,#paneForm,.noprint{display:none!important}
main{display:block;padding:0}
#panePrev{position:static;display:block!important}
#fit{height:auto!important;overflow:visible}
#scaler{transform:none!important;width:100%}
.paper{box-shadow:none;width:100%;min-width:0;padding:0;zoom:.86}
}
</style>
</head>
<body data-tab="form">
<header class="appbar noprint">
 <div class="logo">⚡</div>
 <div><h1>Shift Report P14</h1><p>Electrical Department</p></div>

 </section>

 </section>

<nav class="tabbar noprint" role="tablist">
 <button type="button" role="tab" data-tab="form" aria-selected="true">✎ Isi data</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var KEY="shiftreport_p14_v1",DAYS=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
var S={date:"",shift:"B",by:"",rows:[],att:null},OPEN=-1,ZOOM=false,DL=null,TT;
function $(i){return document.getElementById(i)}
try{if(window.claude&&window.claude.use)window.claude.use("downloads").then(function(d){DL=d}).catch(function(){})}catch(e){}
function pad(n){return String(n).padStart(2,"0")}
function blank(){return{s:"",f:"",iac:"",trouble:"",action:"",cat:""}}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nt(v){var m=/^(\d{1,2})[.:](\d{2})$/.exec(String(v||"").trim());return m?pad(m[1])+":"+m[2]:""}
function tm(v){return String(v||"").replace(":",".")}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fl(s){return String(s||"").split("\n")[0]}
function fmtDate(v){if(!v)return"";var p=v.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return DAYS[d.getDay()]+", "+p[2]+" - "+p[1]+" - "+p[0]}
var LOC=["LSS1","LSS2","LSS3","LSS4","LSS5","LSS6","LSS7","LSS8","LSS9","LSS10","MSS"],FS=["ok","kosong","kering","kotor"],ACS=["Dingin","Normal","Kurang dingin","Panas"],GL={ups:"UPS",dcp:"DC Panel (DCP)"},
AZC=["N4022AG01","N4022AG02","N4022AG03","N4022AG04","N4022AG05","N4022AG06","N4022AG07"],CMC=["Analyzer Coal Mill 1","Analyzer Coal Mill 2"],AR=["Analyzer Preheater","Analyzer Coal Mill"];
function newEl(){return{l:"LSS1",v:"",ah:"",p:""}}
function nextCode(l,list){var u=l.map(function(r){return r.code});for(var i=0;i<list.length;i++)if(u.indexOf(list[i])<0)return list[i];return list[0]}
function newAz(){return{code:nextCode(S.att.az,AZC),co:"",no:"",o2:"",dust:"",hf:"",tr:"",so2:"",wt:"ok",af:"ok",pf:"ok",fl:"",ac:"Dingin",ot:""}}
function newCm(){return{code:nextCode(S.att.cm,CMC),ico:"",io2:"",oco:"",oo2:"",wt:"ok",af:"ok",pf:"ok",fl:"",ac:"Dingin",ot:""}}
function normAreas(a){var o=a.areas,r=o&&typeof o==="object"?{pre:!!o.pre,cm:!!o.cm}:(/coal/i.test(a.area||"")?{pre:false,cm:true}:{pre:true,cm:false});if(!r.pre&&!r.cm)r.pre=true;return r}
function normAtt(a){a=a||{};var t=function(x){return x==null?"":String(x)};
 var r={on:!!a.on,type:/^(electric|instrument)$/.test(a.type)?a.type:"",areas:normAreas(a),ups:[],dcp:[],az:[],cm:[]};
 ["ups","dcp"].forEach(function(k){(a[k]||[]).forEach(function(x){r[k].push({l:LOC.indexOf(x.l)>-1?x.l:"LSS1",v:t(x.v),ah:t(x.ah),p:t(x.p)})})});
 (a.az||[]).forEach(function(x){r.az.push({code:t(x.code)||AZC[0],co:t(x.co),no:t(x.no),o2:t(x.o2),dust:t(x.dust),hf:t(x.hf),tr:t(x.tr),so2:t(x.so2),wt:x.wt||"ok",af:x.af||"ok",pf:x.pf||"ok",fl:t(x.fl),ac:x.ac||"Dingin",ot:t(x.ot)})});
 (a.cm||[]).forEach(function(x){r.cm.push({code:t(x.code)||CMC[0],ico:t(x.ico),io2:t(x.io2),oco:t(x.oco),oo2:t(x.oo2),wt:x.wt||"ok",af:x.af||"ok",pf:x.pf||"ok",fl:t(x.fl),ac:x.ac||"Dingin",ot:t(x.ot)})});
 return r}
function norm(o){var r={date:o.date||today(),shift:/^[ABC]$/.test(o.shift)?o.shift:"B",by:o.by||"",rows:[],att:normAtt(o.att)};
 (o.rows||[]).forEach(function(x){r.rows.push({s:nt(x.s),f:nt(x.f),iac:x.iac||"",trouble:x.trouble||"",action:x.action||"",cat:/^[ABC]$/.test(x.cat)?x.cat:""})});
 if(!r.rows.length)r.rows=[blank()];return r}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var v=localStorage.getItem(KEY);if(v)S=norm(JSON.parse(v))}catch(e){}if(!S.date)S.date=today();if(!S.rows.length)S.rows=[blank()];if(!S.att)S.att=normAtt({})}
function toast(msg,label,fn){$("tmsg").textContent=msg;var b=$("tact");b.hidden=!label;if(label){b.textContent=label;b.onclick=function(){$("toast").classList.remove("show");fn()}}
 $("toast").classList.add("show");clearTimeout(TT);TT=setTimeout(function(){$("toast").classList.remove("show")},label?6000:3000)}

/* ----- Form ----- */
function sumTime(r){return(r.s||r.f)?(tm(r.s)||"--.--")+" – "+(tm(r.f)||"--.--"):"Tanpa jam"}
function sumDesc(r){var a=fl(r.iac),b=fl(r.trouble).replace(/^[-–]\s*/,"");return[a,b].filter(Boolean).join(" · ")||"Ketuk untuk mengisi"}
function entryHtml(r,i){
 var o=OPEN===i;
 return'<article class="card entry'+(o?" open":"")+'">'+
 '<button type="button" class="eh" data-tg="'+i+'" aria-expanded="'+o+'"><span class="no">'+(i+1)+'</span><span class="sm"><b data-s="t'+i+'">'+esc(sumTime(r))+'</b><small data-s="d'+i+'">'+esc(sumDesc(r))+'</small></span><span class="chev">▾</span></button>'+
 '<div class="eb"><div class="row2 f"><div><label>Start</label><input type="time" data-i="'+i+'" data-k="s" value="'+esc(r.s)+'"></div>'+
 '<div><label>Finish</label><input type="time" data-i="'+i+'" data-k="f" value="'+esc(r.f)+'"></div></div>'+
 '<div class="f"><label>IAC Code</label><textarea rows="2" data-i="'+i+'" data-k="iac" placeholder="mis. N5063SV02">'+esc(r.iac)+'</textarea></div>'+
 '<div class="f"><label>Trouble Description</label><textarea rows="3" data-i="'+i+'" data-k="trouble" placeholder="Masalah / permintaan">'+esc(r.trouble)+'</textarea></div>'+
 '<div class="f"><label>Action</label><textarea rows="3" data-i="'+i+'" data-k="action" placeholder="Tindakan yang dilakukan (kata FU / follow up disorot kuning)">'+esc(r.action)+'</textarea></div>'+
 '<div class="f"><label>Category</label><div class="seg">'+["A","B","C"].map(function(c){return'<button type="button" data-cat="'+c+'" data-i="'+i+'" aria-pressed="'+(r.cat===c)+'">'+c+'</button>'}).join("")+'</div>'+
 '<p class="note">A = Down Plant · B = Down Equipment · C = Running. Ketuk lagi untuk mengosongkan.</p></div>'+
